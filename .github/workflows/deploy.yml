name: deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  deploy:
    # The recipe lives in site-kit so it is fixed in one place for every site.
    uses: gfrmin/site-kit/.github/workflows/worker-deploy.yml@master
    with:
      build: npm run build
      # 492 tests across 36 files. A red suite blocks the deploy.
      test: npm test
      # Smoke the Worker that was just deployed, not the custom domain: this URL
      # is correct whether or not blazon.fyi has been cut over yet, and it can
      # never accidentally assert against the old Pages deployment.
      smoke-url: https://blazon.cloudflare-e5f.workers.dev/api/health
      smoke-jq: ".generate and .turnstile and .checkout"
    secrets: inherit

  # Kept as a separate job because the shared smoke check reads the deployed
  # Worker's own view of its config, and this one needs something the Worker
  # cannot see: whether the *client* site key was present at BUILD time.
  #
  # The toxic direction is server-secret-set + client-key-absent. The Worker
  # reports turnstile:true either way, so the shared check passes, while no
  # widget ever renders and every /api/generate returns failed_challenge with
  # nothing for the user to complete.
  turnstile-config:
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Assert Turnstile is not half-configured
        env:
          HEALTH_URL: https://blazon.cloudflare-e5f.workers.dev/api/health
          SITE_KEY_SET: ${{ vars.VITE_TURNSTILE_SITE_KEY != '' }}
        run: |
          set -uo pipefail
          health="$(curl -fsS --retry 5 --retry-delay 3 --retry-connrefused "$HEALTH_URL")" || {
            echo "::warning::health check unreachable — skipping config smoke"; exit 0; }
          echo "health: $health"
          turnstile=$(printf '%s' "$health" | jq -r '.turnstile') || {
            echo "::warning::could not parse health response"; exit 0; }

          if [ "$turnstile" = "true" ] && [ "$SITE_KEY_SET" = "false" ]; then
            echo "::error::Toxic Turnstile half-config: TURNSTILE_SECRET_KEY is set on the Worker but VITE_TURNSTILE_SITE_KEY was empty at build time — no widget renders client-side, so every /api/generate returns failed_challenge with nothing for the user to complete."
            exit 1
          fi
          if [ "$turnstile" = "false" ] && [ "$SITE_KEY_SET" = "true" ]; then
            echo "::warning::Turnstile site key is set but the Worker has no TURNSTILE_SECRET_KEY — the widget renders but /api/generate fail-safes to challenge_unavailable (preset fallback). Degrades safely, but likely a config oversight."
          fi
